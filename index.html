<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DAMZ MIDMAN | Trusted Malaysia</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 20% 10%,rgba(0,132,255,.25),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(0,204,255,.14),transparent 30%),
        linear-gradient(135deg,#020814,#061a31 50%,#01050c);
    overflow-x:hidden;
}

/* =========================
   3D BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(0,153,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,153,255,.035) 1px,transparent 1px);
    background-size:55px 55px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

.orb{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.16;
    pointer-events:none;
    z-index:-1;
}

.orb1{
    background:#008cff;
    top:-100px;
    left:-80px;
}

.orb2{
    background:#00d9ff;
    right:-100px;
    bottom:10%;
}

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#35baff;
    border-radius:50%;
    box-shadow:0 0 12px #00aaff;
    animation:float 8s linear infinite;
    opacity:.6;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{opacity:.7}
    85%{opacity:.7}
    to{
        transform:translateY(-20vh);
        opacity:0;
    }
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:999;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(2,10,20,.78);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(0,153,255,.2);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand img{
    width:43px;
    height:43px;
    object-fit:contain;
    filter:drop-shadow(0 0 12px rgba(0,160,255,.6));
}

.brand-text{
    font-weight:900;
    font-size:20px;
    letter-spacing:1px;
}

.brand-text span{
    color:#00aaff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.lang{
    display:flex;
    gap:5px;
}

.lang button{
    border:1px solid rgba(0,153,255,.5);
    color:#fff;
    background:rgba(0,100,180,.1);
    padding:7px 10px;
    border-radius:7px;
    cursor:pointer;
}

.lang button.active{
    background:#008cff;
    box-shadow:0 0 15px rgba(0,140,255,.5);
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    text-align:center;
    padding:85px 20px 45px;
}

.hero-logo{
    width:110px;
    height:110px;
    object-fit:contain;
    margin-bottom:15px;
    filter:
        drop-shadow(0 0 10px rgba(0,170,255,.7))
        drop-shadow(0 0 35px rgba(0,120,255,.35));
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0) rotateY(0deg)}
    50%{transform:translateY(-9px) rotateY(8deg)}
}

.hero h1{
    font-size:clamp(42px,8vw,82px);
    font-weight:1000;
    letter-spacing:-2px;
    text-transform:uppercase;
    transform:perspective(500px) rotateX(5deg);
    text-shadow:
        0 4px 0 #004d91,
        0 8px 20px rgba(0,0,0,.8),
        0 0 30px rgba(0,153,255,.4);
}

.hero h1 span{
    color:#00aaff;
}

.hero p{
    margin:15px auto 0;
    max-width:650px;
    color:#9db9d4;
    line-height:1.7;
}

/* =========================
   STATS
========================= */

.stats{
    width:90%;
    max-width:900px;
    margin:10px auto 40px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.stat{
    text-align:center;
    padding:18px;
    border:1px solid rgba(0,153,255,.2);
    background:rgba(5,25,45,.55);
    border-radius:15px;
    backdrop-filter:blur(10px);
}

.stat strong{
    display:block;
    font-size:25px;
    color:#00b7ff;
}

.stat span{
    color:#7593ad;
    font-size:12px;
}

/* =========================
   SEARCH
========================= */

.controls{
    width:90%;
    max-width:1100px;
    margin:auto;
}

.search{
    position:relative;
    margin-bottom:20px;
}

.search input{
    width:100%;
    padding:17px 20px 17px 48px;
    border-radius:13px;
    border:1px solid rgba(0,153,255,.35);
    outline:none;
    background:rgba(3,18,33,.85);
    color:#fff;
    font-size:15px;
}

.search input:focus{
    border-color:#00aaff;
    box-shadow:0 0 20px rgba(0,153,255,.12);
}

.search-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);
    color:#00aaff;
}

/* =========================
   FILTER
========================= */

.filters{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:7px;
    margin-bottom:30px;
}

.filters button{
    white-space:nowrap;
    padding:10px 17px;
    border-radius:30px;
    color:#a9c4dc;
    background:rgba(5,28,50,.8);
    border:1px solid rgba(0,153,255,.25);
    cursor:pointer;
    transition:.25s;
}

.filters button:hover,
.filters button.active{
    color:#fff;
    background:linear-gradient(135deg,#0078df,#00b8ff);
    border-color:#00aaff;
    box-shadow:0 0 18px rgba(0,153,255,.25);
}

/* =========================
   MIDMAN GRID
========================= */

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

.midman-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

/* =========================
   CARD
========================= */

.card{
    position:relative;
    padding:22px;
    border-radius:20px;
    overflow:hidden;
    background:
        linear-gradient(145deg,
        rgba(11,40,70,.92),
        rgba(2,14,28,.95));
    border:1px solid rgba(0,153,255,.22);
    box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 0 30px rgba(0,153,255,.025);
    transition:.35s;
}

.card::after{
    content:"";
    position:absolute;
    width:130px;
    height:130px;
    right:-70px;
    top:-70px;
    border-radius:50%;
    background:#008cff;
    filter:blur(70px);
    opacity:.12;
}

.card:hover{
    transform:translateY(-8px);
    border-color:#009cff;
    box-shadow:
        0 20px 50px rgba(0,0,0,.5),
        0 0 25px rgba(0,140,255,.14);
}

.profile{
    display:flex;
    align-items:center;
    gap:14px;
}

.avatar{
    width:68px;
    height:68px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #008cff;
    box-shadow:
        0 0 15px rgba(0,153,255,.45);
}

.profile-info{
    flex:1;
}

.name{
    font-size:19px;
    font-weight:900;
}

.role{
    color:#7898b4;
    font-size:12px;
    margin-top:5px;
}

/* STATUS */

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:17px;
    padding:6px 11px;
    border-radius:30px;
    font-size:11px;
    font-weight:800;
}

.status.online{
    color:#4dffa0;
    background:rgba(0,255,120,.08);
}

.status.busy{
    color:#ffd15c;
    background:rgba(255,193,7,.08);
}

.status.offline{
    color:#ff7180;
    background:rgba(255,60,80,.08);
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
}

.online .dot{
    background:#20ff78;
    box-shadow:0 0 10px #20ff78;
}

.busy .dot{
    background:#ffc107;
    box-shadow:0 0 10px #ffc107;
}

.offline .dot{
    background:#ff5065;
}

/* GAMES */

.games{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:15px;
}

.game{
    font-size:10px;
    padding:5px 8px;
    border-radius:6px;
    color:#8fcfff;
    background:rgba(0,140,255,.08);
    border:1px solid rgba(0,140,255,.16);
}

/* CARD INFO */

.card-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid rgba(255,255,255,.07);
}

.card-info div{
    text-align:center;
}

.card-info small{
    display:block;
    color:#64829d;
    font-size:10px;
    margin-bottom:5px;
}

.card-info strong{
    font-size:13px;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:18px;
}

.btn{
    border:0;
    cursor:pointer;
    padding:11px 8px;
    border-radius:9px;
    color:#fff;
    font-weight:bold;
    text-decoration:none;
    text-align:center;
    font-size:12px;
}

.detail-btn{
    background:rgba(0,130,230,.15);
    border:1px solid rgba(0,153,255,.3);
}

.detail-btn:hover{
    background:rgba(0,130,230,.3);
}

.whatsapp{
    background:linear-gradient(135deg,#078044,#00c76b);
}

.whatsapp:hover{
    box-shadow:0 0 17px rgba(0,200,100,.25);
}

/* =========================
   DETAIL PAGE
========================= */

#detailPage{
    display:none;
    min-height:calc(100vh - 72px);
    padding:50px 20px;
}

.detail-container{
    width:90%;
    max-width:850px;
    margin:auto;
}

.back{
    display:inline-block;
    padding:10px 15px;
    border-radius:9px;
    border:1px solid rgba(0,153,255,.3);
    background:rgba(0,100,180,.1);
    color:#fff;
    cursor:pointer;
    margin-bottom:25px;
}

.detail-card{
    position:relative;
    overflow:hidden;
    padding:35px;
    border-radius:25px;
    background:
        linear-gradient(145deg,
        rgba(10,42,75,.95),
        rgba(2,14,28,.98));
    border:1px solid rgba(0,153,255,.3);
    box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.detail-top{
    display:flex;
    align-items:center;
    gap:25px;
}

.detail-avatar{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:25px;
    border:3px solid #009dff;
    box-shadow:0 0 30px rgba(0,153,255,.3);
}

.detail-name{
    font-size:35px;
    font-weight:900;
}

.detail-role{
    margin-top:7px;
    color:#83a6c2;
}

.detail-section{
    margin-top:30px;
}

.detail-section h3{
    margin-bottom:12px;
    color:#00aaff;
}

.detail-section p{
    color:#9eb6cc;
    line-height:1.8;
}

.detail-games{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.detail-games span{
    padding:8px 12px;
    border-radius:8px;
    background:rgba(0,140,255,.1);
    border:1px solid rgba(0,153,255,.2);
    color:#9fd9ff;
}

.detail-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.detail-stat{
    padding:17px;
    text-align:center;
    border-radius:12px;
    background:rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.06);
}

.detail-stat strong{
    display:block;
    font-size:22px;
    color:#00b7ff;
}

.detail-stat span{
    font-size:11px;
    color:#708ba5;
}

.detail-contact{
    display:block;
    width:100%;
    margin-top:25px;
    padding:15px;
    text-align:center;
    text-decoration:none;
    color:#fff;
    border-radius:12px;
    font-weight:900;
    background:linear-gradient(135deg,#078044,#00c76b);
}

/* =========================
   NO RESULT
========================= */

.no-result{
    display:none;
    text-align:center;
    padding:50px 10px;
    color:#718da7;
}

/* =========================
   FOOTER
========================= */

footer{
    margin-top:70px;
    padding:28px 20px;
    text-align:center;
    color:#607b96;
    font-size:12px;
    border-top:1px solid rgba(0,153,255,.12);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        height:65px;
        padding:0 5%;
    }

    .brand img{
        width:37px;
        height:37px;
    }

    .brand-text{
        font-size:16px;
    }

    .hero{
        padding-top:60px;
    }

    .hero-logo{
        width:85px;
        height:85px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .detail-card{
        padding:22px;
    }

    .detail-top{
        flex-direction:column;
        text-align:center;
    }

    .detail-name{
        font-size:28px;
    }

    .detail-stats{
        grid-template-columns:1fr;
    }

    .buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<script>

/* =====================================================
   DATA MIDMAN
   EDIT BAHAGIAN INI UNTUK TAMBAH / UBAH MIDMAN
===================================================== */

const midmanData = [

    {
        id:1,
        name:"Damz",
        role:"Founder & Senior Midman",
        image:"images/midman1.jpg",

        status:"ONLINE",

        rating:"5.0",
        deals:"250+",
        since:"2025",

        games:[
            "MLBB",
            "FF",
            "EFOOTBALL"
        ],

        phone:"601137851457",

        description:
        "Berpengalaman dalam urusan midman dan jual beli akaun gaming. Mengutamakan keselamatan serta proses transaksi yang jelas."
    },


    {
        id:2,
        name:"Admin A",
        role:"Trusted Midman",
        image:"images/midman2.jpg",

        status:"ONLINE",

        rating:"4.9",
        deals:"180+",
        since:"2025",

        games:[
            "MLBB",
            "FF"
        ],

        phone:"60123456789",

        description:
        "Midman yang membantu urusan transaksi akaun gaming dengan proses yang mudah dan teratur."
    },


    {
        id:3,
        name:"Admin Z",
        role:"Trusted Midman",
        image:"images/midman3.jpg",

        status:"BUSY",

        rating:"4.9",
        deals:"150+",
        since:"2026",

        games:[
            "MLBB",
            "EFOOTBALL"
        ],

        phone:"60198765432",

        description:
        "Menyediakan perkhidmatan midman untuk beberapa kategori gaming dengan fokus kepada transaksi yang selamat."
    },


    {
        id:4,
        name:"Admin D",
        role:"Junior Midman",
        image:"images/midman4.jpg",

        status:"OFFLINE",

        rating:"4.8",
        deals:"90+",
        since:"2026",

        games:[
            "FF",
            "EFOOTBALL"
        ],

        phone:"60111222333",

        description:
        "Membantu pengguna menguruskan transaksi gaming melalui perkhidmatan midman DAMZ."
    }

];


/* =====================================================
   VARIABLES
===================================================== */

let currentCategory = "ALL";


/* =====================================================
   RENDER MIDMAN
===================================================== */

function renderMidman(){

    const grid =
        document.getElementById("midmanGrid");

    grid.innerHTML = "";

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let result = midmanData.filter(person => {

        const matchName =
            person.name
            .toLowerCase()
            .includes(search);

        const matchCategory =
            currentCategory === "ALL" ||
            person.games.includes(currentCategory);

        return matchName && matchCategory;

    });


    result.forEach(person => {

        const statusClass =
            person.status.toLowerCase();

        const gamesHTML =
            person.games
            .map(game =>
                `<span class="game">${game}</span>`
            )
            .join("");


        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="profile">

                <img
                    class="avatar"
                    src="${person.image}"
                    alt="${person.name}">

                <div class="profile-info">

                    <div class="name">
                        ${person.name}
                    </div>

                    <div class="role">
                        ${person.role}
                    </div>

                </div>

            </div>


            <div class="status ${statusClass}">

                <span class="dot"></span>

                ${person.status}

            </div>


            <div class="games">

                ${gamesHTML}

            </div>


            <div class="card-info">

                <div>
                    <small>Rating</small>
                    <strong>⭐ ${person.rating}</strong>
                </div>

                <div>
                    <small>Deal</small>
                    <strong>${person.deals}</strong>
                </div>

                <div>
                    <small>Since</small>
                    <strong>${person.since}</strong>
                </div>

            </div>


            <div class="buttons">

                <button
                    class="btn detail-btn"
                    onclick="showDetail(${person.id})">

                    Lihat Profil

                </button>

                <a
                    class="btn whatsapp"
                    href="https://wa.me/${person.phone}"
                    target="_blank">

                    WhatsApp

                </a>

            </div>

        `;

        grid.appendChild(card);

    });


    document.getElementById("noResult").style.display =
        result.length === 0 ? "block" : "none";

}


/* =====================================================
   FILTER SEARCH
===================================================== */

function filterMidman(){
    renderMidman();
}


/* =====================================================
   CATEGORY
===================================================== */

function setCategory(category,button){

    currentCategory = category;

    document
    .querySelectorAll(".filters button")
    .forEach(btn =>
        btn.classList.remove("active")
    );

    button.classList.add("active");

    renderMidman();

}


/* =====================================================
   DETAIL PROFILE
===================================================== */

function showDetail(id){

    const person =
        midmanData.find(item => item.id === id);

    if(!person) return;

    const statusClass =
        person.status.toLowerCase();

    const gamesHTML =
        person.games
        .map(game =>
            `<span>${game}</span>`
        )
        .join("");


    document.getElementById("detailContent").innerHTML = `

        <div class="detail-top">

            <img
                class="detail-avatar"
                src="${person.image}"
                alt="${person.name}">

            <div>

                <div class="detail-name">
                    ${person.name}
                </div>

                <div class="detail-role">
                    ${person.role}
                </div>

                <div class="status ${statusClass}">
                    <span class="dot"></span>
                    ${person.status}
                </div>

            </div>

        </div>


        <div class="detail-section">

            <h3>🎮 Kategori Game</h3>

            <div class="detail-games">
                ${gamesHTML}
            </div>

        </div>


        <div class="detail-section">

            <h3>📊 Statistik</h3>

            <div class="detail-stats">

                <div class="detail-stat">

                    <strong>
                        ⭐ ${person.rating}
                    </strong>

                    <span>
                        Rating
                    </span>

                </div>


                <div class="detail-stat">

                    <strong>
                        ${person.deals}
                    </strong>

                    <span>
                        Successful Deals
                    </span>

                </div>


                <div class="detail-stat">

                    <strong>
                        ${person.since}
                    </strong>

                    <span>
                        Joined
                    </span>

                </div>

            </div>

        </div>


        <div class="detail-section">

            <h3>🛡️ Tentang Midman</h3>

            <p>
                ${person.description}
            </p>

        </div>


        <a
            class="detail-contact"
            href="https://wa.me/${person.phone}"
            target="_blank">

            💬 Hubungi ${person.name} melalui WhatsApp

        </a>

    `;


    document.getElementById("homePage").style.display = "none";

    document.getElementById("detailPage").style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   BACK HOME
===================================================== */

function showHome(){

    document.getElementById("detailPage").style.display =
        "none";

    document.getElementById("homePage").style.display =
        "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   LANGUAGE
===================================================== */

function changeLanguage(language,button){

    document
    .querySelectorAll(".lang button")
    .forEach(btn =>
        btn.classList.remove("active")
    );

    button.classList.add("active");


    const heroText =
        document.getElementById("heroText");

    const search =
        document.getElementById("searchInput");

    const noResult =
        document.getElementById("noResult");


    if(language === "en"){

        heroText.innerText =
            "Trusted Midman list for gaming account transactions in Malaysia.";

        search.placeholder =
            "Search Midman name...";

        noResult.innerText =
            "❌ No Midman found.";

    }else{

        heroText.innerText =
            "Senarai Midman dipercayai untuk urusan jual beli akaun gaming di Malaysia.";

        search.placeholder =
            "Cari nama Midman...";

        noResult.innerText =
            "❌ Tiada Midman dijumpai.";

    }

}


/* =====================================================
   TOTAL MIDMAN
===================================================== */

document.getElementById("totalMidman").innerText =
    midmanData.length;


/* =====================================================
   START
===================================================== */

renderMidman();

</script>
